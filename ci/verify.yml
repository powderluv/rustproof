# Proof gate: run Verus over the verified TCB crates with the PINNED Z3.
# A green `cargo build` is NOT a green proof -- this job is separate and required.
# TODO(M1): fill in once toolchain/fetch-verus.sh + tools/verify are implemented.
name: verify
on: [push, pull_request]
jobs:
  verus:
    runs-on: [self-hosted, shark-a]   # needs the pinned toolchain
    steps:
      - uses: actions/checkout@v4
      - run: ./toolchain/fetch-verus.sh          # pinned Verus + z3
      - run: cargo xtask verify                  # Verus over crates/{nucleus-core,capabilities,vspace,ipc,iommu-amdvi}
