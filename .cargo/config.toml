# Rustproof build configuration.
#
# The exec/boot build uses STABLE Rust + the built-in freestanding target
# `x86_64-unknown-none` (no build-std, no custom target JSON) for a fast,
# dependency-light inner loop. Build + boot the kernel image with:
#
#     tools/run-qemu.sh                                     # build + boot + check banner
#     cargo build -p nucleus --target x86_64-unknown-none --release
#
# Host tools (tools/*) build for the host target as usual (no --target).
#
# NOTE: the pinned-nightly + custom-target(JSON) + build-std path in
# docs/repo-structure.md §2-3 is for the FUTURE Verus proof track; it is
# intentionally NOT the default so the boot spike builds on stable today.

[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
]

# RISC-V (rv64gc) — S-mode kernel loaded by OpenSBI at 0x8020_0000. See docs/riscv-port.md.
[target.riscv64gc-unknown-none-elf]
rustflags = [
    "-C", "relocation-model=static",
]
