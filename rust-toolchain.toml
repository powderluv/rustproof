# Exec/boot build toolchain. The nucleus boot spike builds on STABLE Rust against
# the built-in `x86_64-unknown-none` target (naked/inline asm and no_std are stable).
#
# The Verus PROOF track will pin its own nightly (docs/verification.md +
# toolchain/verus.lock); that pin is intentionally NOT set here yet, so the boot
# inner-loop builds on a released stable toolchain with no extra download.
[toolchain]
channel = "1.95.0"
targets = ["x86_64-unknown-none"]
profile = "minimal"
