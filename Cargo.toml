# Rustproof — virtual workspace. See docs/repo-structure.md.
# NOTE: pre-M0 scaffold. Crates are stubs; a full build needs the pinned Verus
# toolchain + custom bare-metal target (see docs/repo-structure.md sections 2-3).
[workspace]
resolver = "2"
members = [
    "crates/capabilities",
    "crates/deleg",
    "crates/runstate",
    "crates/regions",
    "crates/vspace",
    "crates/ipc",
    "crates/arch-x86_64",
    "crates/abi",
    "crates/mm",
    "crates/sched",
    "crates/loader",
    "crates/hostcontract",
    "crates/arch-riscv64",
    "crates/vspace-riscv",
    "crates/nucleus-riscv",
    "crates/loader-riscv",
    "crates/riscv-init",
    "crates/hal",
    "crates/kernel",
    "crates/nucleus",
    "crates/userland-rt",
    "crates/init",
    "crates/driver-host",
    "crates/driver-shim",
    "tools/xtask",
    "tools/mkimage",
    "tools/run-vm",
    "tools/verify",
]
exclude = ["vendor"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/powderluv/rustproof"

# no_std kernel/userland: no unwinding.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
